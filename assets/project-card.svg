<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="140" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="pc-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.5" />
    </linearGradient>

    <!-- Traveling Laser -->
    <linearGradient id="pc-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <filter id="pc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    /* Laser Sweep */
    .laser-beam-pc {
      animation: sweepPc 4s linear infinite;
    }
    @keyframes sweepPc {
      0% { transform: translateX(-350px); }
      100% { transform: translateX(850px); }
    }

    .status-pulse-pc {
      animation: pulseGreen 2.2s infinite ease-in-out;
    }
    @keyframes pulseGreen {
      0%, 100% { opacity: 0.6; r: 3.5px; }
      50% { opacity: 1; r: 4.5px; filter: drop-shadow(0 0 6px #22c55e); }
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="136" rx="12" fill="url(#pc-bg)" stroke="url(#pc-border)" stroke-width="1.5" />

  <!-- Top Laser Beam -->
  <g clip-path="url(#pc-clip)">
    <clipPath id="pc-clip">
      <rect x="2" y="2" width="846" height="6" rx="3" />
    </clipPath>
    <rect class="laser-beam-pc" x="0" y="2" width="260" height="2.5" fill="url(#pc-laser)" />
  </g>

  <!-- Cyber Grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="46" x2="850" y2="46" />
    <line x1="0" y1="92" x2="850" y2="92" />
    <line x1="280" y1="0" x2="280" y2="140" />
    <line x1="560" y1="0" x2="560" y2="140" />
  </g>

  <!-- Header Row -->
  <g transform="translate(24, 24)">
    <!-- GitHub Repo Icon -->
    <text x="0" y="10" font-size="16">📚</text>
    <text x="24" y="9" class="mono" fill="#22d3ee" font-size="13" font-weight="700">Full-Stack-Library-Management</text>

    <!-- Branch Pill -->
    <g transform="translate(320, -5)">
      <rect x="0" y="0" width="70" height="20" rx="4" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" />
      <text x="8" y="14" class="mono" fill="#94a3b8" font-size="10.5">⎇ main</text>
    </g>

    <!-- Active Status -->
    <g transform="translate(680, -5)">
      <rect x="0" y="0" width="120" height="20" rx="10" fill="rgba(34, 197, 94, 0.1)" stroke="rgba(34, 197, 94, 0.3)" />
      <circle cx="12" cy="10" r="3.5" fill="#22c55e" class="status-pulse-pc" />
      <text x="22" y="14" class="mono" fill="#4ade80" font-size="9.5" font-weight="600">PUBLIC REPO</text>
    </g>
  </g>

  <!-- Core Focus Section -->
  <g transform="translate(24, 52)">
    <rect x="0" y="0" width="802" height="42" rx="6" fill="#0f172a" stroke="rgba(34, 211, 238, 0.2)" stroke-width="1" />
    <text x="14" y="26" class="mono" fill="#38bdf8" font-size="11" font-weight="700">🎯 CORE FOCUS:</text>
    <text x="120" y="26" class="sans" fill="#e2e8f0" font-size="12" font-weight="500">
      Clean separation of concerns between client views, backend routing, and database records.
    </text>
  </g>

  <!-- Bottom Tech Tags Row -->
  <g transform="translate(24, 106)">
    <!-- GitHub Link Visual -->
    <text x="0" y="14" class="mono" fill="#94a3b8" font-size="11">🔗 github.com/Snigdha-2005/Full-Stack-Library-Management</text>

    <!-- Right Side Badges -->
    <g transform="translate(540, 0)">
      <rect x="0" y="0" width="46" height="20" rx="4" fill="rgba(6, 182, 212, 0.1)" stroke="rgba(6, 182, 212, 0.3)" />
      <text x="23" y="14" text-anchor="middle" class="mono" fill="#22d3ee" font-size="9" font-weight="600">HTML</text>

      <rect x="52" y="0" width="40" height="20" rx="4" fill="rgba(6, 182, 212, 0.1)" stroke="rgba(6, 182, 212, 0.3)" />
      <text x="72" y="14" text-anchor="middle" class="mono" fill="#22d3ee" font-size="9" font-weight="600">CSS</text>

      <rect x="98" y="0" width="36" height="20" rx="4" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.3)" />
      <text x="116" y="14" text-anchor="middle" class="mono" fill="#fbbf24" font-size="9" font-weight="600">JS</text>

      <rect x="140" y="0" width="56" height="20" rx="4" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.3)" />
      <text x="168" y="14" text-anchor="middle" class="mono" fill="#c084fc" font-size="9" font-weight="600">NODE</text>

      <rect x="202" y="0" width="60" height="20" rx="4" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" />
      <text x="232" y="14" text-anchor="middle" class="mono" fill="#34d399" font-size="9" font-weight="600">MONGO</text>
    </g>
  </g>
</svg>
