<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="100%" height="170" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="snk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="snk-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.4" />
    </linearGradient>

    <filter id="snk-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    
    /* Snake Crawl Animation */
    .snake-head {
      animation: snakeMove 6s linear infinite;
    }
    @keyframes snakeMove {
      0% { transform: translate(0, 0); }
      25% { transform: translate(180px, 0); }
      50% { transform: translate(180px, 40px); }
      75% { transform: translate(360px, 40px); }
      100% { transform: translate(540px, 20px); }
    }
    .snake-body-1 { animation: snakeMove 6s linear infinite 0.12s; }
    .snake-body-2 { animation: snakeMove 6s linear infinite 0.24s; }
    .snake-body-3 { animation: snakeMove 6s linear infinite 0.36s; }

    .glow-dot {
      animation: dotGlow 2.5s infinite alternate ease-in-out;
    }
    @keyframes dotGlow {
      0% { opacity: 0.3; }
      100% { opacity: 0.9; filter: drop-shadow(0 0 4px #22d3ee); }
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="166" rx="12" fill="url(#snk-bg)" stroke="url(#snk-border)" stroke-width="1.5" />

  <!-- Title & Status Header -->
  <g transform="translate(24, 26)">
    <circle cx="6" cy="6" r="4" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="20" y="10" class="mono" fill="#34d399" font-size="11.5" font-weight="700" letter-spacing="1">CONTRIBUTION GRID TELEMETRY</text>
    <text x="590" y="10" class="mono" fill="#94a3b8" font-size="11">CYBER SNAKE AGENT</text>
  </g>

