<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="320" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ab-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="ab-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.5" />
    </linearGradient>

    <!-- Moving Laser Sweep -->
    <linearGradient id="ab-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="ab-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    /* Laser Sweep */
    .laser-line {
      animation: sweepLine 4.5s linear infinite;
    }
    @keyframes sweepLine {
      0% { transform: translateX(-350px); }
      100% { transform: translateX(850px); }
    }

    /* Icon Pulse Animations */
    .icon-p1 { animation: pAnim 2.8s infinite ease-in-out; }
    .icon-p2 { animation: pAnim 2.8s infinite ease-in-out 0.5s; }
    .icon-p3 { animation: pAnim 2.8s infinite ease-in-out 1.0s; }
    .icon-p4 { animation: pAnim 2.8s infinite ease-in-out 1.5s; }
    .icon-p5 { animation: pAnim 2.8s infinite ease-in-out 2.0s; }

    @keyframes pAnim {
      0%, 100% { filter: drop-shadow(0 0 2px #22d3ee); transform: scale(1); }
      50% { filter: drop-shadow(0 0 7px #22d3ee); transform: scale(1.08); }
    }

    .status-ping {
      animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes ping {
      75%, 100% { transform: scale(2); opacity: 0; }
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="316" rx="12" fill="url(#ab-bg)" stroke="url(#ab-border)" stroke-width="1.5" />

  <!-- Top Laser Beam -->
  <g clip-path="url(#ab-top-clip)">
    <clipPath id="ab-top-clip">
      <rect x="2" y="2" width="846" height="6" rx="3" />
    </clipPath>
    <rect class="laser-line" x="0" y="2" width="280" height="2.5" fill="url(#ab-laser)" />
  </g>

  <!-- Cyber Grid Pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="52" x2="850" y2="52" />
    <line x1="0" y1="120" x2="850" y2="120" />
    <line x1="0" y1="210" x2="850" y2="210" />
    <line x1="425" y1="0" x2="425" y2="320" />
  </g>

  <!-- Header -->
  <g transform="translate(24, 28)">
    <circle cx="6" cy="6" r="4" fill="#22d3ee" />
    <text x="20" y="10" class="mono" fill="#22d3ee" font-size="12" font-weight="700" letter-spacing="1">ABOUT SNIGDHA DAS</text>
    <text x="590" y="10" class="mono" fill="#94a3b8" font-size="11">FULL-STACK DEVELOPER 🇮🇳</text>
  </g>

  <!-- Bio Highlight Box -->
  <g transform="translate(24, 48)">
    <rect x="0" y="0" width="802" height="52" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <!-- Quote mark -->
    <text x="16" y="32" class="sans" fill="#22d3ee" font-size="22" font-weight="800">“</text>
    <text x="36" y="24" class="sans" fill="#f8fafc" font-size="13" font-weight="500">
      I'm <tspan fill="#38bdf8" font-weight="700">Snigdha Das</tspan>, a passionate full-stack developer from India who enjoys turning ideas
    </text>
    <text x="36" y="42" class="sans" fill="#f8fafc" font-size="13" font-weight="500">
      into practical, reliable, and high-performance web applications.
    </text>
    <text x="502" y="46" class="sans" fill="#22d3ee" font-size="20" font-weight="800">”</text>
  </g>

  <!-- Subtitle -->
  <text x="26" y="126" class="mono" fill="#64748b" font-size="10.5" font-weight="600" letter-spacing="1">FOCUSED ON THE COMPLETE SOFTWARE LIFECYCLE:</text>

  <!-- 5 Core Engineering Pillars -->

  <!-- 1. Frontend Development -->
  <g transform="translate(24, 140)">
    <rect x="0" y="0" width="390" height="46" rx="8" fill="#0f172a" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" />
    <g transform="translate(10, 8)" class="icon-p1">
      <rect x="0" y="0" width="30" height="30" rx="6" fill="rgba(6, 182, 212, 0.15)" />
      <text x="15" y="21" text-anchor="middle" font-size="14">🌐</text>
    </g>
    <text x="50" y="20" class="sans" fill="#ffffff" font-size="12.5" font-weight="700">Frontend Development</text>
    <text x="50" y="35" class="mono" fill="#94a3b8" font-size="9.5">Semantic interfaces &amp; responsive UI/UX</text>
  </g>

  <!-- 2. Backend Development -->
  <g transform="translate(436, 140)">
    <rect x="0" y="0" width="390" height="46" rx="8" fill="#0f172a" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1" />
    <g transform="translate(10, 8)" class="icon-p2">
      <rect x="0" y="0" width="30" height="30" rx="6" fill="rgba(168, 85, 247, 0.15)" />
      <text x="15" y="21" text-anchor="middle" font-size="14">⚙️</text>
    </g>
    <text x="50" y="20" class="sans" fill="#ffffff" font-size="12.5" font-weight="700">Backend Development</text>
    <text x="50" y="35" class="mono" fill="#94a3b8" font-size="9.5">Organized servers &amp; RESTful API routing</text>
  </g>

  <!-- 3. Databases -->
  <g transform="translate(24, 196)">
    <rect x="0" y="0" width="390" height="46" rx="8" fill="#0f172a" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <g transform="translate(10, 8)" class="icon-p3">
      <rect x="0" y="0" width="30" height="30" rx="6" fill="rgba(16, 185, 129, 0.15)" />
      <text x="15" y="21" text-anchor="middle" font-size="14">🗄️</text>
    </g>
    <text x="50" y="20" class="sans" fill="#ffffff" font-size="12.5" font-weight="700">Databases &amp; Storage</text>
    <text x="50" y="35" class="mono" fill="#94a3b8" font-size="9.5">Resilient schemas &amp; structured data collections</text>
  </g>

  <!-- 4. Web Application Architecture -->
  <g transform="translate(436, 196)">
    <rect x="0" y="0" width="390" height="46" rx="8" fill="#0f172a" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1" />
    <g transform="translate(10, 8)" class="icon-p4">
      <rect x="0" y="0" width="30" height="30" rx="6" fill="rgba(59, 130, 246, 0.15)" />
      <text x="15" y="21" text-anchor="middle" font-size="14">📐</text>
    </g>
    <text x="50" y="20" class="sans" fill="#ffffff" font-size="12.5" font-weight="700">Web App Architecture</text>
    <text x="50" y="35" class="mono" fill="#94a3b8" font-size="9.5">Seamless client, API, &amp; data persistence ties</text>
  </g>

  <!-- 5. Continuous Learning (Full Width Banner) -->
  <g transform="translate(24, 252)">
    <rect x="0" y="0" width="802" height="46" rx="8" fill="#0f172a" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1" />
    <g transform="translate(10, 8)" class="icon-p5">
      <rect x="0" y="0" width="30" height="30" rx="6" fill="rgba(236, 72, 153, 0.15)" />
      <text x="15" y="21" text-anchor="middle" font-size="14">🚀</text>
    </g>
    <text x="50" y="20" class="sans" fill="#ffffff" font-size="12.5" font-weight="700">Continuous Learning</text>
    <text x="50" y="35" class="mono" fill="#94a3b8" font-size="9.5">Leveling up engineering foundations, adopting industry best practices &amp; modern paradigms</text>
  </g>
</svg>
