<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%" height="300" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ts-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>

    <!-- Moving Border Highlight -->
    <linearGradient id="ts-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.5" />
    </linearGradient>

    <!-- Top Laser Sweep -->
    <linearGradient id="ts-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neon-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    /* Top Laser Beam Animation */
    .laser-beam {
      animation: sweep 4s linear infinite;
    }
    @keyframes sweep {
      0% { transform: translateX(-350px); }
      100% { transform: translateX(850px); }
    }

    /* Pulse Badges */
    .pulse-cyan { animation: pCyan 3s infinite ease-in-out; }
    .pulse-purple { animation: pPurple 3s infinite ease-in-out 0.8s; }
    .pulse-green { animation: pGreen 3s infinite ease-in-out 1.6s; }

    @keyframes pCyan {
      0%, 100% { stroke: rgba(34, 211, 238, 0.4); box-shadow: 0 0 5px rgba(34, 211, 238, 0.2); }
      50% { stroke: rgba(34, 211, 238, 0.9); filter: drop-shadow(0 0 6px #22d3ee); }
    }
    @keyframes pPurple {
      0%, 100% { stroke: rgba(168, 85, 247, 0.4); }
      50% { stroke: rgba(168, 85, 247, 0.9); filter: drop-shadow(0 0 6px #a855f7); }
    }
    @keyframes pGreen {
      0%, 100% { stroke: rgba(52, 211, 153, 0.4); }
      50% { stroke: rgba(52, 211, 153, 0.9); filter: drop-shadow(0 0 6px #34d399); }
    }

    .status-blink { animation: bl 1.8s infinite alternate ease-in-out; }
    @keyframes bl { 0% { opacity: 0.4; } 100% { opacity: 1; } }
  </style>

  <!-- Base Card -->
  <rect x="2" y="2" width="846" height="296" rx="12" fill="url(#ts-bg)" stroke="url(#ts-border)" stroke-width="1.5" />

  <!-- Top Laser Beam -->
  <g clip-path="url(#border-clip)">
    <clipPath id="border-clip">
      <rect x="2" y="2" width="846" height="6" rx="3" />
    </clipPath>
    <rect class="laser-beam" x="0" y="2" width="280" height="2.5" fill="url(#ts-laser)" />
  </g>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="50" x2="850" y2="50" />
    <line x1="0" y1="130" x2="850" y2="130" />
    <line x1="0" y1="210" x2="850" y2="210" />
    <line x1="280" y1="0" x2="280" y2="300" />
    <line x1="565" y1="0" x2="565" y2="300" />
  </g>

  <!-- Card Header -->
  <g transform="translate(24, 28)">
    <circle cx="6" cy="6" r="4" fill="#22d3ee" class="status-blink" />
    <text x="20" y="10" class="mono" fill="#22d3ee" font-size="12" font-weight="700" letter-spacing="1">ENGINEERING TECH STACK</text>
    <text x="615" y="10" class="mono" fill="#94a3b8" font-size="11">CORE CAPABILITIES</text>
  </g>

  <!-- 3 CATEGORY COLUMNS -->

  <!-- COLUMN 1: FRONTEND -->
  <g transform="translate(24, 58)">
    <!-- Column Panel Container -->
    <rect class="pulse-cyan" x="0" y="0" width="255" height="215" rx="10" fill="#0f172a" stroke="rgba(34, 211, 238, 0.35)" stroke-width="1.5" />
    
    <!-- Category Header -->
    <g transform="translate(16, 20)">
      <circle cx="4" cy="4" r="4" fill="#22d3ee" />
      <text x="16" y="8" class="sans" fill="#ffffff" font-size="14" font-weight="700">Frontend</text>
      <text x="180" y="8" class="mono" fill="#38bdf8" font-size="10" font-weight="600">CLIENT</text>
    </g>

    <!-- Tech Item 1: HTML5 -->
    <g transform="translate(16, 42)">
      <rect x="0" y="0" width="223" height="44" rx="6" fill="rgba(6, 182, 212, 0.08)" stroke="rgba(6, 182, 212, 0.25)" stroke-width="1" />
      <rect x="8" y="10" width="24" height="24" rx="4" fill="rgba(6, 182, 212, 0.2)" />
      <text x="20" y="26" text-anchor="middle" class="mono" fill="#22d3ee" font-size="10" font-weight="700">&lt;&gt;</text>
      <text x="40" y="22" class="mono" fill="#f8fafc" font-size="12" font-weight="700">HTML5</text>
      <text x="40" y="34" class="mono" fill="#94a3b8" font-size="9.5">Semantic Structure</text>
      <circle cx="206" cy="22" r="3" fill="#22d3ee" class="status-blink" />
    </g>

    <!-- Tech Item 2: CSS3 -->
    <g transform="translate(16, 94)">
      <rect x="0" y="0" width="223" height="44" rx="6" fill="rgba(6, 182, 212, 0.08)" stroke="rgba(6, 182, 212, 0.25)" stroke-width="1" />
      <rect x="8" y="10" width="24" height="24" rx="4" fill="rgba(6, 182, 212, 0.2)" />
      <text x="20" y="26" text-anchor="middle" class="mono" fill="#22d3ee" font-size="10" font-weight="700">#</text>
      <text x="40" y="22" class="mono" fill="#f8fafc" font-size="12" font-weight="700">CSS3</text>
      <text x="40" y="34" class="mono" fill="#94a3b8" font-size="9.5">Responsive &amp; Flexbox</text>
      <circle cx="206" cy="22" r="3" fill="#22d3ee" class="status-blink" />
    </g>

    <!-- Tech Item 3: JavaScript -->
    <g transform="translate(16, 146)">
      <rect x="0" y="0" width="223" height="44" rx="6" fill="rgba(245, 158, 11, 0.08)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1" />
      <rect x="8" y="10" width="24" height="24" rx="4" fill="rgba(245, 158, 11, 0.2)" />
      <text x="20" y="26" text-anchor="middle" class="mono" fill="#fbbf24" font-size="10" font-weight="700">JS</text>
      <text x="40" y="22" class="mono" fill="#f8fafc" font-size="12" font-weight="700">JavaScript</text>
      <text x="40" y="34" class="mono" fill="#94a3b8" font-size="9.5">ES6+ &amp; DOM Manipulation</text>
      <circle cx="206" cy="22" r="3" fill="#fbbf24" class="status-blink" />
    </g>
  </g>

  <!-- COLUMN 2: BACKEND -->
  <g transform="translate(297, 58)">
    <rect class="pulse-purple" x="0" y="0" width="255" height="215" rx="10" fill="#0f172a" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.5" />
    
    <g transform="translate(16, 20)">
      <circle cx="4" cy="4" r="4" fill="#c084fc" />
      <text x="16" y="8" class="sans" fill="#ffffff" font-size="14" font-weight="700">Backend</text>
      <text x="175" y="8" class="mono" fill="#c084fc" font-size="10" font-weight="600">SERVER</text>
    </g>

    <!-- Tech Item: Node.js -->
    <g transform="translate(16, 42)">
      <rect x="0" y="0" width="223" height="54" rx="6" fill="rgba(168, 85, 247, 0.08)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1" />
      <rect x="8" y="15" width="24" height="24" rx="4" fill="rgba(168, 85, 247, 0.2)" />
      <text x="20" y="31" text-anchor="middle" class="mono" fill="#c084fc" font-size="11" font-weight="700">⚡</text>
      <text x="40" y="26" class="mono" fill="#f8fafc" font-size="13" font-weight="700">Node.js</text>
      <text x="40" y="42" class="mono" fill="#c084fc" font-size="10">Event-Driven Asynchronous</text>
      <circle cx="206" cy="27" r="3" fill="#c084fc" class="status-blink" />
    </g>

    <!-- Backend Capabilities -->
    <g transform="translate(16, 106)">
      <rect x="0" y="0" width="223" height="84" rx="6" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.06)" />
      <text x="12" y="24" class="mono" fill="#94a3b8" font-size="10.5">● RESTful Routing</text>
      <text x="12" y="44" class="mono" fill="#94a3b8" font-size="10.5">● API Endpoint Handling</text>
      <text x="12" y="64" class="mono" fill="#94a3b8" font-size="10.5">● Server Logic &amp; Middleware</text>
    </g>
  </g>

  <!-- COLUMN 3: DATABASE & STORAGE -->
  <g transform="translate(570, 58)">
    <rect class="pulse-green" x="0" y="0" width="255" height="215" rx="10" fill="#0f172a" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1.5" />
    
    <g transform="translate(16, 20)">
      <circle cx="4" cy="4" r="4" fill="#34d399" />
      <text x="16" y="8" class="sans" fill="#ffffff" font-size="14" font-weight="700">Database &amp; Storage</text>
    </g>

    <!-- Tech Item: MongoDB -->
    <g transform="translate(16, 42)">
      <rect x="0" y="0" width="223" height="48" rx="6" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
      <rect x="8" y="12" width="24" height="24" rx="4" fill="rgba(16, 185, 129, 0.2)" />
      <text x="20" y="28" text-anchor="middle" class="mono" fill="#34d399" font-size="10" font-weight="700">🍃</text>
      <text x="40" y="24" class="mono" fill="#f8fafc" font-size="12" font-weight="700">MongoDB</text>
      <text x="40" y="38" class="mono" fill="#94a3b8" font-size="9.5">NoSQL Document Store</text>
      <circle cx="206" cy="24" r="3" fill="#34d399" class="status-blink" />
    </g>

    <!-- Tech Item: DBMS -->
    <g transform="translate(16, 98)">
      <rect x="0" y="0" width="223" height="48" rx="6" fill="rgba(59, 130, 246, 0.08)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1" />
      <rect x="8" y="12" width="24" height="24" rx="4" fill="rgba(59, 130, 246, 0.2)" />
      <text x="20" y="28" text-anchor="middle" class="mono" fill="#60a5fa" font-size="10" font-weight="700">🗄️</text>
      <text x="40" y="24" class="mono" fill="#f8fafc" font-size="12" font-weight="700">DBMS</text>
      <text x="40" y="38" class="mono" fill="#94a3b8" font-size="9.5">Data Modeling &amp; Queries</text>
      <circle cx="206" cy="24" r="3" fill="#60a5fa" class="status-blink" />
    </g>

    <!-- Schema Integrity Badge -->
    <g transform="translate(16, 154)">
      <rect x="0" y="0" width="223" height="36" rx="6" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.06)" />
      <text x="111" y="22" text-anchor="middle" class="mono" fill="#34d399" font-size="10" font-weight="600">✔ PERSISTENCE ARCHITECTURE</text>
    </g>
  </g>
</svg>
