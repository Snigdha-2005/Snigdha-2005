<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="cf-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.5" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    /* Moving data laser */
    .conduit-laser {
      stroke-dasharray: 12 140;
      animation: cLaser 2.6s linear infinite;
    }
    @keyframes cLaser {
      0% { stroke-dashoffset: 180; }
      100% { stroke-dashoffset: -180; }
    }

    /* Node pulse */
    .p-box1 { animation: pB1 2.8s infinite ease-in-out; }
    .p-box2 { animation: pB2 2.8s infinite ease-in-out 0.8s; }
    .p-box3 { animation: pB3 2.8s infinite ease-in-out 1.6s; }

    @keyframes pB1 {
      0%, 100% { stroke: #06b6d4; }
      50% { stroke: #22d3ee; filter: drop-shadow(0 0 8px #22d3ee); }
    }
    @keyframes pB2 {
      0%, 100% { stroke: #10b981; }
      50% { stroke: #34d399; filter: drop-shadow(0 0 8px #34d399); }
    }
    @keyframes pB3 {
      0%, 100% { stroke: #a855f7; }
      50% { stroke: #c084fc; filter: drop-shadow(0 0 8px #c084fc); }
    }

    .arrow-b { animation: aB 2s infinite ease-in-out; }
    @keyframes aB {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #22d3ee); }
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="196" rx="12" fill="url(#cf-bg)" stroke="url(#cf-border)" stroke-width="1.5" />

  <!-- Subtle Cyber Grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="50" x2="850" y2="50" />
    <line x1="0" y1="100" x2="850" y2="100" />
    <line x1="0" y1="150" x2="850" y2="150" />
    <line x1="280" y1="0" x2="280" y2="200" />
    <line x1="565" y1="0" x2="565" y2="200" />
  </g>

  <!-- Title & Status Header -->
  <g transform="translate(24, 26)">
    <circle cx="6" cy="6" r="4" fill="#22d3ee">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="20" y="10" class="mono" fill="#22d3ee" font-size="11.5" font-weight="700" letter-spacing="1">ACTIVITY PIPELINE</text>
    <text x="635" y="10" class="mono" fill="#94a3b8" font-size="11">AUTOMATED WORKFLOW</text>
  </g>

  <!-- Base Connector Line -->
  <line x1="140" y1="112" x2="710" y2="112" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2" />
  <!-- Animated Traveling Laser -->
  <line x1="140" y1="112" x2="710" y2="112" stroke="#22d3ee" stroke-width="2.5" class="conduit-laser" filter="url(#cf-glow)" />

  <!-- 3 NODES -->

  <!-- NODE 1: Contribution Graph -->
  <g transform="translate(36, 60)">
    <rect class="p-box1" x="0" y="0" width="220" height="104" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <rect x="14" y="12" width="24" height="24" rx="4" fill="rgba(6, 182, 212, 0.15)" />
    <text x="26" y="28" text-anchor="middle" class="mono" fill="#22d3ee" font-size="12">📊</text>
    <text x="46" y="24" class="sans" fill="#ffffff" font-size="14" font-weight="700">Contribution Graph</text>
    <text x="46" y="38" class="mono" fill="#94a3b8" font-size="10">GitHub Commit History</text>
    <rect x="14" y="68" width="192" height="22" rx="4" fill="rgba(6, 182, 212, 0.1)" />
    <text x="110" y="83" text-anchor="middle" class="mono" fill="#22d3ee" font-size="9.5" font-weight="600">INPUT: COMMITS &amp; PRS</text>
  </g>

  <!-- ARROW 1 -->
  <g class="arrow-b" transform="translate(268, 106)">
    <circle cx="10" cy="6" r="6" fill="rgba(34, 211, 238, 0.2)" />
    <path d="M6 6 L14 6 M10 2 L14 6 L10 10" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- NODE 2: Animated Snake -->
  <g transform="translate(305, 60)">
    <rect class="p-box2" x="0" y="0" width="230" height="104" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <rect x="14" y="12" width="24" height="24" rx="4" fill="rgba(16, 185, 129, 0.15)" />
    <text x="26" y="28" text-anchor="middle" class="mono" fill="#34d399" font-size="12">🐍</text>
    <text x="46" y="24" class="sans" fill="#ffffff" font-size="14" font-weight="700">Animated Snake</text>
    <text x="46" y="38" class="mono" fill="#34d399" font-size="10">cron: 0 */12 * * *</text>
    <rect x="14" y="68" width="202" height="22" rx="4" fill="rgba(16, 185, 129, 0.1)" />
    <text x="115" y="83" text-anchor="middle" class="mono" fill="#34d399" font-size="9.5" font-weight="600">ACTION: AUTOMATED CRON</text>
  </g>

  <!-- ARROW 2 -->
  <g class="arrow-b" transform="translate(548, 106)">
    <circle cx="10" cy="6" r="6" fill="rgba(168, 85, 247, 0.2)" />
    <path d="M6 6 L14 6 M10 2 L14 6 L10 10" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- NODE 3: Open Source Activity -->
  <g transform="translate(585, 60)">
    <rect class="p-box3" x="0" y="0" width="230" height="104" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
    <rect x="14" y="12" width="24" height="24" rx="4" fill="rgba(168, 85, 247, 0.15)" />
    <text x="26" y="28" text-anchor="middle" class="mono" fill="#c084fc" font-size="12">🚀</text>
    <text x="46" y="24" class="sans" fill="#ffffff" font-size="14" font-weight="700">Open Source Activity</text>
    <text x="46" y="38" class="mono" fill="#94a3b8" font-size="10">Live Community Impact</text>
    <rect x="14" y="68" width="202" height="22" rx="4" fill="rgba(168, 85, 247, 0.1)" />
    <text x="115" y="83" text-anchor="middle" class="mono" fill="#c084fc" font-size="9.5" font-weight="600">OUTPUT: REPO ENGAGEMENT</text>
  </g>
</svg>
