<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="header-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="term-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace;
    }
    .term-title {
      font-size: 13px;
      font-weight: 600;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .prompt-user {
      fill: #22d3ee;
      font-weight: 700;
      font-size: 13.5px;
    }
    .prompt-symbol {
      fill: #c084fc;
      font-weight: 700;
      font-size: 13.5px;
    }
    .cmd-text {
      fill: #f8fafc;
      font-weight: 500;
      font-size: 13.5px;
    }
    .output-text {
      fill: #cbd5e1;
      font-size: 13px;
      font-weight: 400;
    }
    .accent-cyan {
      fill: #38bdf8;
      font-weight: 600;
    }
    .accent-purple {
      fill: #c084fc;
      font-weight: 600;
    }
    .accent-green {
      fill: #4ade80;
      font-weight: 600;
    }
    .dim-text {
      fill: #64748b;
      font-size: 12.5px;
    }

    /* Cursor Blink Animation */
    .cursor-blink {
      animation: blink 1.05s infinite;
    }
    @keyframes blink {
      0%, 45% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Ambient pulse on status dot */
    .status-dot-pulse {
      animation: statusGlow 2.5s infinite alternate ease-in-out;
    }
    @keyframes statusGlow {
      0% { opacity: 0.7; r: 3.5px; }
      100% { opacity: 1; r: 4.5px; filter: drop-shadow(0 0 6px #4ade80); }
    }
  </style>

  <!-- Window Container Card -->
  <rect x="2" y="2" width="816" height="476" rx="12" fill="url(#term-bg)" stroke="url(#term-border)" stroke-width="1.5" />

  <!-- Terminal Header / Titlebar -->
  <path d="M2 14 Q2 2 14 2 L806 2 Q818 2 818 14 L818 42 L2 42 Z" fill="url(#header-bg)" />
  <line x1="2" y1="42" x2="818" y2="42" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Window Control Buttons (macOS Style) -->
  <circle cx="24" cy="22" r="5.5" fill="#f43f5e" opacity="0.9" />
  <circle cx="42" cy="22" r="5.5" fill="#eab308" opacity="0.9" />
  <circle cx="60" cy="22" r="5.5" fill="#22c55e" opacity="0.9" />

  <!-- Window Title -->
  <g class="font-mono">
    <text x="410" y="26" text-anchor="middle" class="term-title">snigdha@github: ~ (zsh)</text>
  </g>

  <!-- Right status badge -->
  <rect x="670" y="14" width="132" height="18" rx="9" fill="rgba(34, 197, 94, 0.12)" stroke="rgba(34, 197, 94, 0.3)" stroke-width="1" />
  <circle cx="682" cy="23" r="4" fill="#22c55e" class="status-dot-pulse" />
  <text x="694" y="26.5" class="font-mono" fill="#4ade80" font-size="10" font-weight="600" letter-spacing="0.5">DEV SESSION READY</text>

  <!-- Subtle Inner Grid Watermark -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="2" y1="90" x2="818" y2="90" />
    <line x1="2" y1="140" x2="818" y2="140" />
    <line x1="2" y1="190" x2="818" y2="190" />
    <line x1="2" y1="240" x2="818" y2="240" />
    <line x1="2" y1="290" x2="818" y2="290" />
    <line x1="2" y1="340" x2="818" y2="340" />
    <line x1="2" y1="390" x2="818" y2="390" />
    <line x1="2" y1="440" x2="818" y2="440" />
  </g>

  <!-- Terminal Content Area -->
  <g class="font-mono" transform="translate(24, 0)">

    <!-- Command 1: whoami -->
    <g transform="translate(0, 72)">
      <text x="0" y="0">
        <tspan class="prompt-user">snigdha@github</tspan>
        <tspan class="dim-text">:</tspan>
        <tspan class="prompt-symbol">~</tspan>
        <tspan class="dim-text">$ </tspan>
        <tspan class="cmd-text">whoami</tspan>
      </text>
      <text x="18" y="24" class="output-text">
        <tspan class="accent-cyan">snigdha-das</tspan>
        <tspan class="dim-text"> [Full-Stack Developer from India 🇮🇳]</tspan>
      </text>
    </g>

    <!-- Command 2: skills -->
    <g transform="translate(0, 134)">
      <text x="0" y="0">
        <tspan class="prompt-user">snigdha@github</tspan>
        <tspan class="dim-text">:</tspan>
        <tspan class="prompt-symbol">~</tspan>
        <tspan class="dim-text">$ </tspan>
        <tspan class="cmd-text">skills</tspan>
      </text>
      <!-- Skill Chips / Tags -->
      <g transform="translate(18, 12)">
        <!-- HTML -->
        <rect x="0" y="0" width="58" height="22" rx="4" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.35)" />
        <text x="29" y="15" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="600">HTML</text>

        <!-- CSS -->
        <rect x="68" y="0" width="52" height="22" rx="4" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.35)" />
        <text x="94" y="15" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="600">CSS</text>

        <!-- JavaScript -->
        <rect x="130" y="0" width="98" height="22" rx="4" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.35)" />
        <text x="179" y="15" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">JavaScript</text>

        <!-- DBMS -->
        <rect x="238" y="0" width="62" height="22" rx="4" fill="rgba(59, 130, 246, 0.12)" stroke="rgba(59, 130, 246, 0.35)" />
        <text x="269" y="15" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="600">DBMS</text>

        <!-- MongoDB -->
        <rect x="310" y="0" width="86" height="22" rx="4" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" />
        <text x="353" y="15" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">MongoDB</text>

        <!-- Node.js -->
        <rect x="406" y="0" width="76" height="22" rx="4" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.35)" />
        <text x="444" y="15" text-anchor="middle" fill="#c084fc" font-size="11" font-weight="600">Node.js</text>
      </g>
    </g>

    <!-- Command 3: current_project -->
    <g transform="translate(0, 208)">
      <text x="0" y="0">
        <tspan class="prompt-user">snigdha@github</tspan>
        <tspan class="dim-text">:</tspan>
        <tspan class="prompt-symbol">~</tspan>
        <tspan class="dim-text">$ </tspan>
        <tspan class="cmd-text">current_project</tspan>
      </text>
      <text x="18" y="24" class="output-text">
        <tspan class="accent-purple">📚 Full-Stack-Library-Management</tspan>
        <tspan class="dim-text"> (Web UI ➔ Express API ➔ MongoDB)</tspan>
      </text>
    </g>

    <!-- Command 4: learning -->
    <g transform="translate(0, 272)">
      <text x="0" y="0">
        <tspan class="prompt-user">snigdha@github</tspan>
        <tspan class="dim-text">:</tspan>
        <tspan class="prompt-symbol">~</tspan>
        <tspan class="dim-text">$ </tspan>
        <tspan class="cmd-text">learning</tspan>
      </text>
      <text x="18" y="24" class="output-text">
        <tspan class="accent-cyan">🌱 Full Stack Development</tspan>
        <tspan class="dim-text"> [Frontend ➔ Backend ➔ Database ➔ Architecture]</tspan>
      </text>
    </g>

    <!-- Command 5: status -->
    <g transform="translate(0, 336)">
      <text x="0" y="0">
        <tspan class="prompt-user">snigdha@github</tspan>
        <tspan class="dim-text">:</tspan>
        <tspan class="prompt-symbol">~</tspan>
        <tspan class="dim-text">$ </tspan>
        <tspan class="cmd-text">status</tspan>
      </text>
      <text x="18" y="24" class="output-text">
        <tspan class="accent-green">⚡ Building something useful...</tspan>
        <tspan class="dim-text"> [Active &amp; Committed to Continuous Improvement]</tspan>
      </text>
    </g>

    <!-- Active Prompt with Blinking Cursor -->
    <g transform="translate(0, 404)">
      <text x="0" y="0">
        <tspan class="prompt-user">snigdha@github</tspan>
        <tspan class="dim-text">:</tspan>
        <tspan class="prompt-symbol">~</tspan>
        <tspan class="dim-text">$ </tspan>
      </text>
      <!-- Blinking Terminal Cursor Block -->
      <rect class="cursor-blink" x="182" y="-13" width="9" height="17" rx="1.5" fill="#22d3ee" filter="url(#cyan-glow)" />
    </g>

  </g>

</svg>
