<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 180" width="100%" height="180" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Node Gradient 1: Cyan -->
    <linearGradient id="node-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="100%" stop-color="#0e2a38" />
    </linearGradient>

    <!-- Node Gradient 2: Purple -->
    <linearGradient id="node-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Node Gradient 3: Emerald -->
    <linearGradient id="node-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#062d24" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
    }
    .node-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .node-sub {
      font-size: 10px;
      fill: #94a3b8;
    }
    .arrow-anim {
      animation: pulseArrow 2s infinite ease-in-out;
    }
    @keyframes pulseArrow {
      0% { opacity: 0.4; }
      50% { opacity: 1; filter: drop-shadow(0 0 4px #22d3ee); }
      100% { opacity: 0.4; }
    }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="816" height="176" rx="10" fill="url(#card-bg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Subtitle Header -->
  <text x="24" y="32" class="mono" fill="#64748b" font-size="11" font-weight="600" letter-spacing="1">SYSTEM ARCHITECTURE PIPELINE</text>
  <text x="630" y="32" class="mono" fill="#38bdf8" font-size="10" font-weight="600">FULL-STACK FLOW</text>

  <!-- 5 Nodes Pipeline -->
  <!-- Node 1: Frontend -->
  <g transform="translate(24, 52)">
    <rect x="0" y="0" width="130" height="96" rx="8" fill="url(#node-cyan)" stroke="#06b6d4" stroke-width="1.2" />
    <circle cx="16" cy="18" r="4" fill="#22d3ee" />
    <text x="28" y="22" class="mono" fill="#22d3ee" font-size="10" font-weight="700">CLIENT LAYER</text>
    <text x="14" y="52" class="mono node-title" fill="#f8fafc">Frontend</text>
    <text x="14" y="70" class="mono node-sub">HTML • CSS • JS</text>
    <rect x="14" y="80" width="80" height="4" rx="2" fill="#06b6d4" opacity="0.6" />
  </g>

  <!-- Arrow 1 -->
  <g class="arrow-anim" transform="translate(160, 92)">
    <path d="M0 8 L24 8 M16 2 L24 8 L16 14" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Node 2: Web Interface -->
  <g transform="translate(190, 52)">
    <rect x="0" y="0" width="130" height="96" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="16" cy="18" r="4" fill="#38bdf8" />
    <text x="28" y="22" class="mono" fill="#38bdf8" font-size="10" font-weight="700">UI / PORTAL</text>
    <text x="14" y="52" class="mono node-title" fill="#f8fafc">Web Interface</text>
    <text x="14" y="70" class="mono node-sub">Responsive Views</text>
    <rect x="14" y="80" width="80" height="4" rx="2" fill="#38bdf8" opacity="0.6" />
  </g>

  <!-- Arrow 2 -->
  <g class="arrow-anim" transform="translate(326, 92)">
    <path d="M0 8 L24 8 M16 2 L24 8 L16 14" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Node 3: Backend / API -->
  <g transform="translate(356, 52)">
    <rect x="0" y="0" width="130" height="96" rx="8" fill="url(#node-purple)" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="16" cy="18" r="4" fill="#c084fc" />
    <text x="28" y="22" class="mono" fill="#c084fc" font-size="10" font-weight="700">SERVER CORE</text>
    <text x="14" y="52" class="mono node-title" fill="#f8fafc">Backend / API</text>
    <text x="14" y="70" class="mono node-sub">Node.js Runtime</text>
    <rect x="14" y="80" width="80" height="4" rx="2" fill="#a855f7" opacity="0.6" />
  </g>

  <!-- Arrow 3 -->
  <g class="arrow-anim" transform="translate(492, 92)">
    <path d="M0 8 L24 8 M16 2 L24 8 L16 14" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Node 4: Database -->
  <g transform="translate(522, 52)">
    <rect x="0" y="0" width="130" height="96" rx="8" fill="url(#node-emerald)" stroke="#10b981" stroke-width="1.2" />
    <circle cx="16" cy="18" r="4" fill="#34d399" />
    <text x="28" y="22" class="mono" fill="#34d399" font-size="10" font-weight="700">PERSISTENCE</text>
    <text x="14" y="52" class="mono node-title" fill="#f8fafc">Database</text>
    <text x="14" y="70" class="mono node-sub">MongoDB • DBMS</text>
    <rect x="14" y="80" width="80" height="4" rx="2" fill="#10b981" opacity="0.6" />
  </g>

  <!-- Arrow 4 -->
  <g class="arrow-anim" transform="translate(658, 92)">
    <path d="M0 8 L24 8 M16 2 L24 8 L16 14" stroke="#e879f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Node 5: Library Management -->
  <g transform="translate(688, 52)">
    <rect x="0" y="0" width="108" height="96" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#e879f9" stroke-width="1.2" />
    <circle cx="16" cy="18" r="4" fill="#e879f9" />
    <text x="28" y="22" class="mono" fill="#e879f9" font-size="9" font-weight="700">APP DOMAIN</text>
    <text x="12" y="52" class="mono" fill="#f8fafc" font-size="11" font-weight="700">Library</text>
    <text x="12" y="66" class="mono" fill="#f8fafc" font-size="11" font-weight="700">Management</text>
    <rect x="12" y="80" width="70" height="4" rx="2" fill="#e879f9" opacity="0.6" />
  </g>

</svg>
