<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="250" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="lp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="lp-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.5" />
    </linearGradient>

    <!-- Flowing Stream Pulse -->
    <linearGradient id="pulse-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="1" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.1" />
    </linearGradient>

    <filter id="lp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    /* Animated traveling laser */
    .stream-laser {
      stroke-dasharray: 14 160;
      animation: laserTravel 3.2s linear infinite;
    }
    @keyframes laserTravel {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: -200; }
    }

    /* Pulsing Card Nodes */
    .p-node1 { animation: pCard1 3s infinite ease-in-out; }
    .p-node2 { animation: pCard2 3s infinite ease-in-out 0.6s; }
    .p-node3 { animation: pCard3 3s infinite ease-in-out 1.2s; }
    .p-node4 { animation: pCard4 3s infinite ease-in-out 1.8s; }
    .p-node5 { animation: pCard5 3s infinite ease-in-out 2.4s; }

    @keyframes pCard1 {
      0%, 100% { stroke: #06b6d4; filter: drop-shadow(0 0 2px #06b6d4); }
      50% { stroke: #22d3ee; filter: drop-shadow(0 0 8px #22d3ee); }
    }
    @keyframes pCard2 {
      0%, 100% { stroke: #a855f7; filter: drop-shadow(0 0 2px #a855f7); }
      50% { stroke: #c084fc; filter: drop-shadow(0 0 8px #c084fc); }
    }
    @keyframes pCard3 {
      0%, 100% { stroke: #10b981; filter: drop-shadow(0 0 2px #10b981); }
      50% { stroke: #34d399; filter: drop-shadow(0 0 8px #34d399); }
    }
    @keyframes pCard4 {
      0%, 100% { stroke: #3b82f6; filter: drop-shadow(0 0 2px #3b82f6); }
      50% { stroke: #60a5fa; filter: drop-shadow(0 0 8px #60a5fa); }
    }
    @keyframes pCard5 {
      0%, 100% { stroke: #ec4899; filter: drop-shadow(0 0 2px #ec4899); }
      50% { stroke: #f472b6; filter: drop-shadow(0 0 8px #f472b6); }
    }

    .arrow-pulse { animation: aPulse 2s infinite ease-in-out; }
    @keyframes aPulse {
      0%, 100% { opacity: 0.35; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 5px #22d3ee); }
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="246" rx="12" fill="url(#lp-bg)" stroke="url(#lp-border)" stroke-width="1.5" />

  <!-- Subtle Cyber Grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="850" y2="60" />
    <line x1="0" y1="125" x2="850" y2="125" />
    <line x1="0" y1="190" x2="850" y2="190" />
    <line x1="170" y1="0" x2="170" y2="250" />
    <line x1="340" y1="0" x2="340" y2="250" />
    <line x1="510" y1="0" x2="510" y2="250" />
    <line x1="680" y1="0" x2="680" y2="250" />
  </g>

  <!-- Header -->
  <g transform="translate(24, 28)">
    <circle cx="6" cy="6" r="4" fill="#22d3ee">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="20" y="10" class="mono" fill="#22d3ee" font-size="12" font-weight="700" letter-spacing="1">LEARNING ROADMAP PIPELINE</text>
    <text x="590" y="10" class="mono" fill="#4ade80" font-size="11">● ACTIVE PROGRESSION</text>
  </g>

  <!-- Continuous Laser Conduit Line -->
  <line x1="95" y1="135" x2="755" y2="135" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2" />
  <line x1="95" y1="135" x2="755" y2="135" stroke="#22d3ee" stroke-width="2.5" class="stream-laser" filter="url(#lp-glow)" />

  <!-- 5 Progress Stages -->

  <!-- STAGE 1: Frontend -->
  <g transform="translate(30, 75)">
    <rect class="p-node1" x="0" y="0" width="130" height="115" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <rect x="10" y="10" width="46" height="18" rx="4" fill="rgba(6, 182, 212, 0.2)" />
    <text x="33" y="23" text-anchor="middle" class="mono" fill="#22d3ee" font-size="9" font-weight="700">STEP 1</text>
    <text x="14" y="52" class="sans" fill="#ffffff" font-size="14" font-weight="700">Frontend</text>
    <text x="14" y="70" class="mono" fill="#94a3b8" font-size="10.5">HTML • CSS • JS</text>
    <rect x="14" y="86" width="102" height="18" rx="4" fill="rgba(34, 197, 94, 0.12)" />
    <text x="65" y="99" text-anchor="middle" class="mono" fill="#4ade80" font-size="9" font-weight="600">✔ SOLIDIFIED</text>
  </g>

  <!-- ARROW 1 -->
  <g class="arrow-pulse" transform="translate(168, 129)">
    <circle cx="10" cy="6" r="6" fill="rgba(34, 211, 238, 0.2)" />
    <path d="M6 6 L14 6 M10 2 L14 6 L10 10" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- STAGE 2: Backend -->
  <g transform="translate(198, 75)">
    <rect class="p-node2" x="0" y="0" width="130" height="115" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
    <rect x="10" y="10" width="46" height="18" rx="4" fill="rgba(168, 85, 247, 0.2)" />
    <text x="33" y="23" text-anchor="middle" class="mono" fill="#c084fc" font-size="9" font-weight="700">STEP 2</text>
    <text x="14" y="52" class="sans" fill="#ffffff" font-size="14" font-weight="700">Backend</text>
    <text x="14" y="70" class="mono" fill="#94a3b8" font-size="10.5">Node.js Engine</text>
    <rect x="14" y="86" width="102" height="18" rx="4" fill="rgba(168, 85, 247, 0.12)" />
    <text x="65" y="99" text-anchor="middle" class="mono" fill="#c084fc" font-size="9" font-weight="600">● IN PROGRESS</text>
  </g>

  <!-- ARROW 2 -->
  <g class="arrow-pulse" transform="translate(336, 129)">
    <circle cx="10" cy="6" r="6" fill="rgba(168, 85, 247, 0.2)" />
    <path d="M6 6 L14 6 M10 2 L14 6 L10 10" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- STAGE 3: Database -->
  <g transform="translate(366, 75)">
    <rect class="p-node3" x="0" y="0" width="130" height="115" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <rect x="10" y="10" width="46" height="18" rx="4" fill="rgba(16, 185, 129, 0.2)" />
    <text x="33" y="23" text-anchor="middle" class="mono" fill="#34d399" font-size="9" font-weight="700">STEP 3</text>
    <text x="14" y="52" class="sans" fill="#ffffff" font-size="14" font-weight="700">Database</text>
    <text x="14" y="70" class="mono" fill="#94a3b8" font-size="10.5">MongoDB • DBMS</text>
    <rect x="14" y="86" width="102" height="18" rx="4" fill="rgba(16, 185, 129, 0.12)" />
    <text x="65" y="99" text-anchor="middle" class="mono" fill="#34d399" font-size="9" font-weight="600">● IN PROGRESS</text>
  </g>

  <!-- ARROW 3 -->
  <g class="arrow-pulse" transform="translate(504, 129)">
    <circle cx="10" cy="6" r="6" fill="rgba(16, 185, 129, 0.2)" />
    <path d="M6 6 L14 6 M10 2 L14 6 L10 10" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- STAGE 4: APIs -->
  <g transform="translate(534, 75)">
    <rect class="p-node4" x="0" y="0" width="130" height="115" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="10" y="10" width="46" height="18" rx="4" fill="rgba(59, 130, 246, 0.2)" />
    <text x="33" y="23" text-anchor="middle" class="mono" fill="#60a5fa" font-size="9" font-weight="700">STEP 4</text>
    <text x="14" y="52" class="sans" fill="#ffffff" font-size="14" font-weight="700">APIs</text>
    <text x="14" y="70" class="mono" fill="#94a3b8" font-size="10.5">REST Endpoints</text>
    <rect x="14" y="86" width="102" height="18" rx="4" fill="rgba(59, 130, 246, 0.12)" />
    <text x="65" y="99" text-anchor="middle" class="mono" fill="#60a5fa" font-size="9" font-weight="600">⚡ CONNECTIVITY</text>
  </g>

  <!-- ARROW 4 -->
  <g class="arrow-pulse" transform="translate(672, 129)">
    <circle cx="10" cy="6" r="6" fill="rgba(236, 72, 153, 0.2)" />
    <path d="M6 6 L14 6 M10 2 L14 6 L10 10" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- STAGE 5: Full-Stack Applications -->
  <g transform="translate(702, 75)">
    <rect class="p-node5" x="0" y="0" width="120" height="115" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
    <rect x="10" y="10" width="46" height="18" rx="4" fill="rgba(236, 72, 153, 0.2)" />
    <text x="33" y="23" text-anchor="middle" class="mono" fill="#f472b6" font-size="9" font-weight="700">STEP 5</text>
    <text x="12" y="48" class="sans" fill="#ffffff" font-size="13" font-weight="700">Full-Stack</text>
    <text x="12" y="66" class="sans" fill="#ffffff" font-size="13" font-weight="700">Applications</text>
    <rect x="10" y="86" width="100" height="18" rx="4" fill="rgba(236, 72, 153, 0.12)" />
    <text x="60" y="99" text-anchor="middle" class="mono" fill="#f472b6" font-size="9" font-weight="600">★ HORIZON</text>
  </g>

  <!-- Bottom Subtitle -->
  <g transform="translate(24, 218)">
    <text x="0" y="14" class="mono" fill="#64748b" font-size="10.5">GOAL: ARCHITECTING SCALABLE, PRACTICAL END-TO-END WEB APPLICATIONS</text>
  </g>
</svg>
