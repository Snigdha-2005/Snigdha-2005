<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Card Border -->
    <linearGradient id="bf-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.5" />
    </linearGradient>

    <!-- Stream Pulse Gradient -->
    <linearGradient id="stream-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <filter id="bf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
    }
    .sans {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    /* Animated Traveling Signal Line */
    .signal-line {
      stroke-dasharray: 12 180;
      animation: signalMove 3.2s linear infinite;
    }
    @keyframes signalMove {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: -200; }
    }

    /* Node Pulse Animations */
    .node-pulse-1 { animation: pulseCyan 2.8s infinite ease-in-out; }
    .node-pulse-2 { animation: pulseBlue 2.8s infinite ease-in-out 0.6s; }
    .node-pulse-3 { animation: pulsePurple 2.8s infinite ease-in-out 1.2s; }
    .node-pulse-4 { animation: pulseEmerald 2.8s infinite ease-in-out 1.8s; }
    .node-pulse-5 { animation: pulsePink 2.8s infinite ease-in-out 2.4s; }

    @keyframes pulseCyan {
      0%, 100% { stroke: #06b6d4; filter: drop-shadow(0 0 2px #06b6d4); }
      50% { stroke: #22d3ee; filter: drop-shadow(0 0 10px #22d3ee); }
    }
    @keyframes pulseBlue {
      0%, 100% { stroke: #3b82f6; filter: drop-shadow(0 0 2px #3b82f6); }
      50% { stroke: #60a5fa; filter: drop-shadow(0 0 10px #60a5fa); }
    }
    @keyframes pulsePurple {
      0%, 100% { stroke: #a855f7; filter: drop-shadow(0 0 2px #a855f7); }
      50% { stroke: #c084fc; filter: drop-shadow(0 0 10px #c084fc); }
    }
    @keyframes pulseEmerald {
      0%, 100% { stroke: #10b981; filter: drop-shadow(0 0 2px #10b981); }
      50% { stroke: #34d399; filter: drop-shadow(0 0 10px #34d399); }
    }
    @keyframes pulsePink {
      0%, 100% { stroke: #ec4899; filter: drop-shadow(0 0 2px #ec4899); }
      50% { stroke: #f472b6; filter: drop-shadow(0 0 10px #f472b6); }
    }

    /* Arrow Glow Pulse */
    .arrow-dot {
      animation: arrowStream 2s infinite ease-in-out;
    }
    @keyframes arrowStream {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 6px #22d3ee); }
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="256" rx="12" fill="url(#bf-bg)" stroke="url(#bf-border)" stroke-width="1.5" />

  <!-- Grid Pattern Watermark -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="65" x2="850" y2="65" />
    <line x1="0" y1="130" x2="850" y2="130" />
    <line x1="0" y1="195" x2="850" y2="195" />
    <line x1="170" y1="0" x2="170" y2="260" />
    <line x1="340" y1="0" x2="340" y2="260" />
    <line x1="510" y1="0" x2="510" y2="260" />
    <line x1="680" y1="0" x2="680" y2="260" />
  </g>

  <!-- Title & Status Header -->
  <g transform="translate(24, 28)">
    <circle cx="6" cy="6" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="20" y="10" class="mono" fill="#22d3ee" font-size="11.5" font-weight="700" letter-spacing="1">PROJECT EXECUTION PIPELINE</text>
    <text x="610" y="10" class="mono" fill="#94a3b8" font-size="11">LIVE DATAFLOW</text>
  </g>

  <!-- Background Continuous Connector Line -->
  <line x1="95" y1="140" x2="755" y2="140" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2" />
  <!-- Animated Traveling Laser Beam -->
  <line x1="95" y1="140" x2="755" y2="140" stroke="#22d3ee" stroke-width="2.5" class="signal-line" filter="url(#bf-glow)" />

  <!-- 5 Pipeline Nodes -->

  <!-- NODE 1: Frontend -->
  <g transform="translate(30, 80)">
    <rect class="node-pulse-1" x="0" y="0" width="130" height="120" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <!-- Step Badge -->
    <rect x="10" y="10" width="50" height="18" rx="4" fill="rgba(6, 182, 212, 0.15)" />
    <text x="35" y="23" text-anchor="middle" class="mono" fill="#22d3ee" font-size="9" font-weight="700">01 STAGE</text>
    <!-- Node Title -->
    <text x="14" y="52" class="sans" fill="#ffffff" font-size="14" font-weight="700">Frontend</text>
    <text x="14" y="70" class="mono" fill="#94a3b8" font-size="10.5">HTML • CSS • JS</text>
    <!-- Status -->
    <rect x="14" y="90" width="102" height="18" rx="4" fill="rgba(34, 211, 238, 0.1)" />
    <text x="65" y="103" text-anchor="middle" class="mono" fill="#38bdf8" font-size="9" font-weight="600">CLIENT LAYER</text>
  </g>

  <!-- ARROW 1 -->
  <g class="arrow-dot" transform="translate(168, 134)">
    <circle cx="10" cy="6" r="6" fill="rgba(34, 211, 238, 0.2)" />
    <path d="M6 6 L14 6 M10 2 L14 6 L10 10" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- NODE 2: Web Interface -->
  <g transform="translate(198, 80)">
    <rect class="node-pulse-2" x="0" y="0" width="130" height="120" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="10" y="10" width="50" height="18" rx="4" fill="rgba(59, 130, 246, 0.15)" />
    <text x="35" y="23" text-anchor="middle" class="mono" fill="#60a5fa" font-size="9" font-weight="700">02 STAGE</text>
    <text x="14" y="52" class="sans" fill="#ffffff" font-size="14" font-weight="700">Web Interface</text>
    <text x="14" y="70" class="mono" fill="#94a3b8" font-size="10.5">Responsive Views</text>
    <rect x="14" y="90" width="102" height="18" rx="4" fill="rgba(59, 130, 246, 0.1)" />
    <text x="65" y="103" text-anchor="middle" class="mono" fill="#60a5fa" font-size="9" font-weight="600">USER PORTAL</text>
  </g>

  <!-- ARROW 2 -->
  <g class="arrow-dot" transform="translate(336, 134)">
    <circle cx="10" cy="6" r="6" fill="rgba(168, 85, 247, 0.2)" />
    <path d="M6 6 L14 6 M10 2 L14 6 L10 10" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- NODE 3: Backend / API -->
  <g transform="translate(366, 80)">
    <rect class="node-pulse-3" x="0" y="0" width="130" height="120" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
    <rect x="10" y="10" width="50" height="18" rx="4" fill="rgba(168, 85, 247, 0.15)" />
    <text x="35" y="23" text-anchor="middle" class="mono" fill="#c084fc" font-size="9" font-weight="700">03 STAGE</text>
    <text x="14" y="52" class="sans" fill="#ffffff" font-size="14" font-weight="700">Backend / API</text>
    <text x="14" y="70" class="mono" fill="#94a3b8" font-size="10.5">Node.js Runtime</text>
    <rect x="14" y="90" width="102" height="18" rx="4" fill="rgba(168, 85, 247, 0.1)" />
    <text x="65" y="103" text-anchor="middle" class="mono" fill="#c084fc" font-size="9" font-weight="600">REST ROUTING</text>
  </g>

  <!-- ARROW 3 -->
  <g class="arrow-dot" transform="translate(504, 134)">
    <circle cx="10" cy="6" r="6" fill="rgba(16, 185, 129, 0.2)" />
    <path d="M6 6 L14 6 M10 2 L14 6 L10 10" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- NODE 4: Database -->
  <g transform="translate(534, 80)">
    <rect class="node-pulse-4" x="0" y="0" width="130" height="120" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <rect x="10" y="10" width="50" height="18" rx="4" fill="rgba(16, 185, 129, 0.15)" />
    <text x="35" y="23" text-anchor="middle" class="mono" fill="#34d399" font-size="9" font-weight="700">04 STAGE</text>
    <text x="14" y="52" class="sans" fill="#ffffff" font-size="14" font-weight="700">Database</text>
    <text x="14" y="70" class="mono" fill="#94a3b8" font-size="10.5">MongoDB • DBMS</text>
    <rect x="14" y="90" width="102" height="18" rx="4" fill="rgba(16, 185, 129, 0.1)" />
    <text x="65" y="103" text-anchor="middle" class="mono" fill="#34d399" font-size="9" font-weight="600">DATA STORAGE</text>
  </g>

  <!-- ARROW 4 -->
  <g class="arrow-dot" transform="translate(672, 134)">
    <circle cx="10" cy="6" r="6" fill="rgba(236, 72, 153, 0.2)" />
    <path d="M6 6 L14 6 M10 2 L14 6 L10 10" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- NODE 5: Library Management -->
  <g transform="translate(702, 80)">
    <rect class="node-pulse-5" x="0" y="0" width="120" height="120" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
    <rect x="10" y="10" width="50" height="18" rx="4" fill="rgba(236, 72, 153, 0.15)" />
    <text x="35" y="23" text-anchor="middle" class="mono" fill="#f472b6" font-size="9" font-weight="700">TARGET</text>
    <text x="12" y="48" class="sans" fill="#ffffff" font-size="13" font-weight="700">Library</text>
    <text x="12" y="66" class="sans" fill="#ffffff" font-size="13" font-weight="700">Management</text>
    <rect x="10" y="90" width="100" height="18" rx="4" fill="rgba(236, 72, 153, 0.1)" />
    <text x="60" y="103" text-anchor="middle" class="mono" fill="#f472b6" font-size="9" font-weight="600">APPLICATION</text>
  </g>

  <!-- Bottom Interactive Status Stream -->
  <g transform="translate(24, 230)">
    <text x="0" y="14" class="mono" fill="#64748b" font-size="10.5">ARCHITECTURE FLOW: CLIENT VIEW ➔ REST API ➔ MONGO PERSISTENCE ➔ OPERATIONS</text>
  </g>
</svg>
